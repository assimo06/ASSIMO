<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Assimo - PC</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body style="background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <h1>Assimo PC</h1>
    <button onclick="generer()" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">Générer le QR Code</button>
    <div id="qrcode" style="margin-top: 20px; background: white; padding: 10px; border-radius: 8px;"></div>

    <script>
        function generer() {
            document.getElementById("qrcode").innerHTML = "";
            const sessionId = Math.random().toString(36).substring(2, 9);
            const lienMobile = "https://assim06.github.io/ASSIMO/mobile.html?session=" + sessionId;
            
            new QRCode(document.getElementById("qrcode"), {
                text: lienMobile,
                width: 150,
                height: 150
            });
        }
    </script>
</body>
</html>
