<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assimo - Contrôle à distance</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #38bdf8; margin-bottom: 5px; }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            transition: background 0.2s;
        }
        button:hover { background-color: #2563eb; }
        #qrcode-container {
            margin: 20px auto;
            position: relative;
            display: inline-block;
            background: white;
            padding: 15px;
            border-radius: 12px;
        }
        #logo-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 45px;
            height: 45px;
            background: #0284c7;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 11px;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .hidden { display: none; }
        .status { color: #94a3b8; font-style: italic; margin-top: 15px; }
        #remote-screen {
            width: 100%;
            max-height: 70vh;
            background: black;
            border-radius: 8px;
            margin-top: 15px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Assimo</h1>
        <p>Contrôlez votre téléphone depuis votre PC en toute simplicité.</p>
        
        <button id="btn-generate" onclick="startSession()">Générer le QR Code</button>

        <div id="session-area" class="hidden">
            <div id="qrcode-container">
                <div id="qrcode"></div>
                <div id="logo-overlay">ASSIMO</div>
            </div>
            <p class="status">Scannez ce QR code avec l'appareil photo de votre téléphone</p>
        </div>

        <div id="connected-panel" class="hidden">
            <p style="color: #22c55e; font-weight: bold;">Téléphone connecté à Assimo !</p>
            <!-- C'est ici que l'écran du téléphone va s'afficher en direct -->
            <video id="remote-screen" autoplay playsinline></video>
        </div>
    </div>

    <script>
        function startSession() {
            document.getElementById('btn-generate').style.display = 'none';
            document.getElementById('session-area').classList.remove('hidden');

            // ID de session unique
            const sessionId = Math.random().toString(36).substring(2, 9);
            const qrContainer = document.getElementById("qrcode");
            qrContainer.innerHTML = "";

            // Le QR code redirigera vers la page mobile d'Assimo avec l'ID de session
            // (Remplacez l'URL locale par votre lien hébergé plus tard)
            const mobileUrl = window.location.origin + "/mobile.html?session=" + sessionId;

            new QRCode(qrContainer, {
                text: mobileUrl,
                width: 160,
                height: 160,
            });

            // Note : Pour l'instant, c'est l'interface PC. 
            // Pour que la vraie liaison se fasse, il faudra connecter ce script à un serveur WebSockets (Socket.io).
        }
    </script>
</body>
</html>
