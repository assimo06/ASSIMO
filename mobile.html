<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSIMO — Partage d'Écran Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-6">
    <div class="max-w-md mx-auto w-full my-auto glass-panel rounded-3xl p-8 text-center shadow-2xl">
        <div class="h-16 w-16 mx-auto mb-6 rounded-2xl bg-gradient-to-tr from-brand-600 to-cyan-400 flex items-center justify-center shadow-lg shadow-brand-500/30">
            <i data-lucide="smartphone" class="h-8 w-8 text-white"></i>
        </div>
        
        <h1 class="text-2xl font-extrabold text-white mb-2">Partage d'Écran</h1>
        <p class="text-slate-400 text-sm mb-6">Confirmez le code PIN pour diffuser l'écran de votre téléphone vers le PC.</p>
        
        <!-- Formulaire de saisie du PIN -->
        <div id="pin-form-container" class="space-y-4 mb-6">
            <input type="text" id="user-pin-input" maxlength="4" placeholder="----" class="w-full text-center text-3xl font-mono tracking-widest py-3 rounded-xl bg-slate-900 border border-slate-700 text-brand-400 focus:outline-none focus:border-brand-500">
            <button onclick="verifyAndShareScreen()" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-brand-600 to-cyan-500 hover:from-brand-500 hover:to-cyan-400 text-white font-bold transition shadow-lg shadow-brand-600/20 text-sm flex items-center justify-center space-x-2">
                <i data-lucide="cast" class="h-4 w-4"></i>
                <span>Partager mon Écran</span>
            </button>
            <p id="pin-error" class="text-rose-400 text-xs hidden">Code PIN incorrect ou vide.</p>
        </div>

        <!-- Vue de diffusion active sur le mobile -->
        <div id="broadcasting-view" class="hidden space-y-4">
            <div class="p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold">
                ✓ Partage d'écran actif ! Votre écran est diffusé sur le PC.
            </div>
            <div class="aspect-[9/16] max-h-[300px] bg-black rounded-2xl overflow-hidden border border-slate-800 relative mx-auto">
                <video id="local-preview" autoplay playsinline muted class="w-full h-full object-cover"></video>
            </div>
            <button onclick="stopSharing()" class="w-full py-3 px-4 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 font-semibold transition text-sm">
                Arrêter le partage
            </button>
        </div>

    </div>

    <script>
        lucide.createIcons();
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session');
        const expectedPin = urlParams.get('pin');
        let channel = null;

        if (sessionId) {
            channel = new BroadcastChannel(`assimo_channel_${sessionId}`);
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (expectedPin) {
                document.getElementById('user-pin-input').value = expectedPin;
            }
        });

        async function verifyAndShareScreen() {
            const enteredPin = document.getElementById('user-pin-input').value.trim();

            if (enteredPin === expectedPin || enteredPin.length === 4) {
                try {
                    // Demande l'autorisation système au téléphone de capturer l'écran
                    const screenStream = await navigator.mediaDevices.getDisplayMedia({
                        video: { cursor: "always" },
                        audio: false
                    });

                    // Affiche l'aperçu local sur le téléphone
                    document.getElementById('local-preview').srcObject = screenStream;

                    // Notifie le PC que le partage d'écran est actif
                    localStorage.setItem(`assimo_screen_active_${sessionId}`, 'true');
                    if (channel) channel.postMessage({ type: 'SCREEN_READY' });

                    document.getElementById('pin-form-container').classList.add('hidden');
                    document.getElementById('broadcasting-view').classList.remove('hidden');

                    // Gestion de l'arrêt du partage par l'utilisateur depuis les contrôles du système mobile
                    screenStream.getVideoTracks()[0].onended = () => {
                        stopSharing();
                    };

                } catch (err) {
                    alert("Erreur ou refus du partage d'écran : " + err.message);
                }
            } else {
                document.getElementById('pin-error').classList.remove('hidden');
            }
        }

        function stopSharing() {
            const preview = document.getElementById('local-preview');
            if (preview && preview.srcObject) {
                preview.srcObject.getTracks().forEach(track => track.stop());
            }
            localStorage.removeItem(`assimo_screen_active_${sessionId}`);
            document.getElementById('broadcasting-view').classList.add('hidden');
            document.getElementById('pin-form-container').classList.remove('hidden');
        }
    </script>
</body>
</html>
