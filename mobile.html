<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assimo - Connexion Mobile</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            max-width: 400px;
            width: 100%;
        }
        h1 { color: #38bdf8; }
        button {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            width: 100%;
        }
        button:hover { background-color: #16a34a; }
        .danger { background-color: #ef4444; }
        .danger:hover { background-color: #dc2626; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Assimo Connect</h1>
        <p id="info-text">Une demande de liaison avec un ordinateur a été reçue.</p>
        
        <button id="connect-btn" onclick="requestScreenShare()">Se connecter et partager l'écran</button>
    </div>

    <script>
        async function requestScreenShare() {
            try {
                // Sur les navigateurs mobiles compatibles (Android / Chrome), 
                // cela demande l'autorisation de capturer l'écran ou une application
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always" },
                    audio: false
                });
                
                document.getElementById('info-text').textContent = "Partage d'écran actif vers Assimo PC !";
                document.getElementById('connect-btn').style.display = 'none';

                // Ici, le flux 'stream' sera envoyé en P2P (WebRTC) vers l'ordinateur de l'utilisateur.
            } catch (err) {
                alert("Le partage d'écran a été refusé ou n'est pas supporté par ce navigateur mobile : " + err.message);
            }
        }
    </script>
</body>
</html>
