<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Assimo - Mobile</title>
</head>
<body style="background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; padding: 20px;">
    <h1>Assimo Mobile</h1>
    <p id="txt">Appuie sur le bouton pour lancer la liaison.</p>
    <button onclick="partager()" style="padding: 12px 24px; font-size: 16px; background: #22c55e; color: white; border: none; border-radius: 6px; cursor: pointer;">Se connecter</button>

    <script>
        async function partager() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
                document.getElementById("txt").textContent = "Connecté avec succès !";
            } catch (err) {
                alert("Erreur : " + err.message);
            }
        }
    </script>
</body>
</html>
