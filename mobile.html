<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSIMO — Terminal Mobile Connecté</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-6">
    <div class="max-w-md mx-auto w-full my-auto glass-panel rounded-3xl p-8 text-center shadow-2xl">
        <div class="h-16 w-16 mx-auto mb-6 rounded-2xl bg-gradient-to-tr from-sky-600 to-cyan-400 flex items-center justify-center shadow-lg shadow-sky-500/30">
            <i data-lucide="smartphone" class="h-8 w-8 text-white"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-white mb-2">Terminal Mobile Prêt</h1>
        <p class="text-slate-400 text-sm mb-6">Session ID : <code id="mobile-session-id" class="text-sky-400 font-mono font-bold">--</code></p>
        <div class="p-4 rounded-xl bg-slate-900/80 border border-slate-800 text-xs text-slate-300 mb-6">
            Pont sécurisé établi avec succès. Votre appareil est prêt pour le streaming et le contrôle à distance.
        </div>
        <button onclick="window.close()" class="w-full py-3 px-4 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 font-semibold border border-slate-800 transition text-sm">
            Fermer la fenêtre
        </button>
    </div>
    <script>
        lucide.createIcons();
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session');
        if (sessionId) {
            document.getElementById('mobile-session-id').textContent = sessionId;
        }
    </script>
</body>
</html>
