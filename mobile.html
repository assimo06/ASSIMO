<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSIMO Mobile — Secure Client Node</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            900: '#0369a1',
                            950: '#082f49'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-6 selection:bg-brand-500 selection:text-white">

    <!-- Top Header -->
    <header class="w-full max-w-md flex items-center justify-between py-4 border-b border-slate-800/80">
        <div class="flex items-center space-x-2.5">
            <div class="h-9 w-9 rounded-xl bg-gradient-to-tr from-brand-600 to-cyan-400 flex items-center justify-center shadow-lg shadow-brand-500/30">
                <i data-lucide="smartphone" class="h-5 w-5 text-white"></i>
            </div>
            <div>
                <span class="text-lg font-extrabold tracking-tight text-white">ASSIMO Mobile</span>
                <span class="text-[10px] uppercase tracking-widest block text-brand-400 font-semibold">Client Terminal</span>
            </div>
        </div>
        <div id="session-badge" class="px-2.5 py-1 rounded-full bg-slate-900 border border-slate-800 text-xs font-mono text-slate-400">
            Session: <span id="lbl-session" class="text-brand-400 font-bold">--</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="w-full max-w-md my-auto py-6 flex flex-col items-center text-center">
        
        <div class="w-24 h-24 rounded-3xl bg-brand-500/10 border border-brand-500/20 flex items-center justify-center mb-6 text-brand-400 shadow-2xl shadow-brand-500/20">
            <i data-lucide="cast" class="h-12 w-12 animate-pulse"></i>
        </div>

        <h1 class="text-2xl font-extrabold text-white mb-2">Liaison Établie</h1>
        <p id="status-desc" class="text-slate-400 text-sm mb-8 px-4 leading-relaxed">
            Votre terminal mobile est prêt à relayer le flux vidéo ou à interagir avec le poste maître Assimo.
        </p>

        <!-- Interactive Control Box -->
        <div class="w-full glass-card rounded-3xl p-6 shadow-xl mb-6">
            <div class="space-y-4">
                <div class="flex items-center justify-between p-3 rounded-xl bg-slate-900/60 border border-slate-800/80 text-left">
                    <div class="flex items-center space-x-3">
                        <i data-lucide="shield" class="h-5 w-5 text-emerald-400"></i>
                        <div>
                            <span class="text-sm font-bold text-white block">Sécurité SSL / HTTPS</span>
                            <span class="text-xs text-slate-400">Connexion cryptée active</span>
                        </div>
                    </div>
                    <span class="h-3 w-3 rounded-full bg-emerald-500"></span>
                </div>

                <button id="btn-action" onclick="requestScreenShare()" class="w-full py-4 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white font-bold shadow-lg shadow-emerald-500/25 transition-all flex items-center justify-center space-x-2">
                    <i data-lucide="video" class="h-5 w-5"></i>
                    <span>Partager l'écran / Caméra</span>
                </button>
            </div>
        </div>

        <!-- Video preview if captured locally -->
        <div id="preview-container" class="w-full hidden rounded-2xl overflow-hidden bg-black aspect-video border border-slate-800 mb-6 relative shadow-2xl">
            <video id="local-video" autoplay playsinline muted class="w-full h-full object-cover"></video>
            <div class="absolute bottom-3 left-3 px-2.5 py-1 rounded-md bg-black/60 backdrop-blur-md text-[10px] text-white font-mono">
                LIVE CAPTURE
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-md py-4 text-center text-xs text-slate-500 border-t border-slate-800/80">
        <p>ASSIMO Mobile Node &bull; Prêt pour le contrôle</p>
    </footer>

    <script>
        lucide.createIcons();

        // Extraction propre de la session dans l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session');
        if (sessionId) {
            document.getElementById('lbl-session').textContent = sessionId;
        } else {
            document.getElementById('lbl-session').textContent = 'DIRECT';
        }

        async function requestScreenShare() {
            const btn = document.getElementById('btn-action');
            const desc = document.getElementById('status-desc');
            const preview = document.getElementById('preview-container');
            const videoElem = document.getElementById('local-video');

            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
                    throw new Error("L'API de capture d'écran getDisplayMedia est restreinte ou non supportée par ce navigateur mobile.");
                }

                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always" },
                    audio: false
                });

                videoElem.srcObject = stream;
                preview.classList.remove('hidden');
                
                desc.textContent = "Partage d'écran actif et en cours de diffusion vers le poste maître Assimo.";
                btn.innerHTML = `<i data-lucide="check" class="h-5 w-5"></i><span>Flux Actif & Connecté</span>`;
                btn.className = "w-full py-4 rounded-xl bg-slate-800 text-emerald-400 font-bold border border-emerald-500/30 flex items-center justify-center space-x-2 cursor-default";
                
                lucide.createIcons();
            } catch (err) {
                console.warn("Screen share error:", err);
                alert("Erreur de capture : " + err.message);
            }
        }
    </script>
</body>
</html>
