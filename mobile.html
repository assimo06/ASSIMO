<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSIMO — Terminal Mobile Contrôlé</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-6">
    <div class="max-w-md mx-auto w-full my-auto glass-panel rounded-3xl p-8 text-center shadow-2xl">
        <div class="h-16 w-16 mx-auto mb-6 rounded-2xl bg-gradient-to-tr from-emerald-600 to-cyan-400 flex items-center justify-center shadow-lg shadow-emerald-500/30">
            <i data-lucide="smartphone" class="h-8 w-8 text-white"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-white mb-2">Terminal Téléphone Connecté</h1>
        <p class="text-slate-400 text-sm mb-6">Session ID : <code id="mobile-session-id" class="text-emerald-400 font-mono font-bold">--</code></p>
        
        <!-- Zone d'affichage des commandes clavier reçues du PC -->
        <div class="p-5 rounded-2xl bg-slate-900 border border-slate-800 mb-6 text-left">
            <span class="text-xs uppercase tracking-wider text-slate-500 font-bold block mb-2">Entrées Clavier du PC en direct :</span>
            <div id="remote-input-display" class="text-2xl font-mono text-brand-400 font-bold tracking-wide min-h-[40px] flex items-center">
                En attente de frappe...
            </div>
        </div>

        <div class="text-xs text-slate-400 mb-6 leading-relaxed">
            Tapez sur le clavier de votre PC : les lettres s'inscrivent instantanément ici sur votre mobile.
        </div>

        <button onclick="window.close()" class="w-full py-3 px-4 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 font-semibold border border-slate-800 transition text-sm">
            Fermer
        </button>
    </div>

    <script>
        lucide.createIcons();
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session');
        
        if (sessionId) {
            document.getElementById('mobile-session-id').textContent = sessionId;
            // 1. Notifie le PC que le mobile est bien connecté
            localStorage.setItem(`assimo_connected_${sessionId}`, 'true');

            // 2. Écoute en boucle les touches envoyées par le PC
            setInterval(() => {
                const rawKeyData = localStorage.getItem(`assimo_key_${sessionId}`);
                if (rawKeyData) {
                    try {
                        const data = JSON.parse(rawKeyData);
                        const displayBox = document.getElementById('remote-input-display');
                        displayBox.textContent = `Touche : ${data.key}`;
                    } catch(e) {}
                }
            }, 100);
        }
    </script>
</body>
</html>
